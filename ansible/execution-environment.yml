---
# Build:  ansible-builder build -t txlf-2026-ee:latest
# For a 4.18 cluster (KubeVirt v1.6.6):
#   ansible-builder build -t txlf-2026-ee:4.18 \
#     --build-arg VIRTCTL_VERSION=v1.6.6 --build-arg OC_CHANNEL=stable-4.18
version: 3

images:
  base_image:
    name: quay.io/fedora/fedora:44

dependencies:
  python_interpreter:
    package_system: python3
    python_path: /usr/bin/python3
  ansible_core:
    package_pip: ansible-core>=2.16
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_steps:
  prepend_base:
    - RUN dnf install -y python3 python3-pip && dnf clean all
  append_final:
    - ARG VIRTCTL_VERSION=v1.9.1
    - ARG OC_CHANNEL=stable-4.21
    # virtctl must match the KubeVirt version on the cluster.
    - RUN curl -fsSL -o /usr/local/bin/virtctl https://github.com/kubevirt/kubevirt/releases/download/${VIRTCTL_VERSION}/virtctl-${VIRTCTL_VERSION}-linux-amd64 && chmod 0755 /usr/local/bin/virtctl
    # oc + kubectl: oc is only used for `oc adm create-login-template` (see README).
    - RUN curl -fsSL https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${OC_CHANNEL}/openshift-client-linux.tar.gz | tar -xz -C /usr/local/bin oc kubectl
    - RUN figlet -v >/dev/null && virtctl version --client && oc version --client
