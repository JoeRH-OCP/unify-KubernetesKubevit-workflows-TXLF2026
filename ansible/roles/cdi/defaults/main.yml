---
cdi_namespace: cdi
cdi_wait_timeout: 900
cdi_namespace_labels:
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/audit: privileged
  pod-security.kubernetes.io/warn: privileged
  security.openshift.io/scc.podSecurityLabelSync: "false"
# "auto" = copy the OpenShift cluster-wide Proxy into spec.config.importProxy.
# Or set a dict: {HTTPProxy: ..., HTTPSProxy: ..., noProxy: ...}. {} = no proxy.
cdi_import_proxy: auto
cdi_proxy_ca_configmap: "{{ event_slug }}-proxy-ca"
# Smart clone: CDI defaults to csi-clone for Ceph RBD; the demo wants snapshot clones.
cdi_clone_strategy: snapshot
cdi_feature_gates:
  - HonorWaitForFirstConsumer
