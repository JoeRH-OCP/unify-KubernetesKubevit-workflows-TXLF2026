---
# Must be set to true on the command line: -e confirm_cnv_removal=true
confirm_cnv_removal: false
cnv_namespace: openshift-cnv
cnv_os_images_namespace: openshift-virtualization-os-images
cnv_delete_os_images_namespace: true
cnv_wait_timeout: 1200
# CRD groups removed after CNV is gone: kubevirt.io and every *.kubevirt.io group
# (cdi, hco, ssp, networkaddonsoperator.network, snapshot, export, instancetype,
# pool, migrations, clone, aaq, hostpathprovisioner, ...).
cnv_crd_group_regex: '(^|\.)kubevirt\.io$'
# Never touched, even if a future CRD group would match the regex.
cnv_protected_crd_groups:
  - nmstate.io
  - ocs.openshift.io
  - odf.openshift.io
  - ceph.rook.io
  - csiaddons.openshift.io
  - noobaa.io
  - objectbucket.io
  - snapshot.storage.k8s.io
  - k8s.cni.cncf.io

# MTV (Migration Toolkit for Virtualization) depends on OpenShift Virtualization.
# With virt_mode=kubevirt it is removed first, only with -e confirm_mtv_removal=true.
confirm_mtv_removal: false
mtv_crd_group_regex: '(^|\.)forklift\.konveyor\.io$'
mtv_console_plugin: forklift-console-plugin

# Clusters provisioned with Argo CD (e.g. Red Hat Demo Platform) would reinstall
# CNV/MTV/VMs on the next sync. Disable auto-sync on the Applications that manage
# them (and their parent app-of-apps). Originals go to reports/argocd-original.yaml.
cnv_disable_argocd_autosync: true
# Kinds that mark an Argo CD Application as "managing virtualization".
cnv_argocd_marker_kinds: [HyperConverged, ForkliftController, VirtualMachine, VirtualMachineInstance, DataVolume, Plan, Provider]
cnv_argocd_marker_subscriptions: [kubevirt-hyperconverged, mtv-operator]
# HCO can deadlock on delete (its webhook needs the SSP it just removed); after
# this timeout the role removes the operator (Subscription/CSV) and then the finalizer.
cnv_hco_wait_timeout: 600
