---
- name: List CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
  register: cnv_crds_all

- name: Select orphan KubeVirt/CNV CRDs
  ansible.builtin.set_fact:
    cnv_orphan_crds: >-
      {{ cnv_crds_all.resources
         | selectattr('spec.group', 'match', '.*' ~ cnv_crd_group_regex)
         | rejectattr('spec.group', 'in', cnv_protected_crd_groups)
         | list }}

- name: Show orphan CRDs
  ansible.builtin.debug:
    msg: "{{ cnv_orphan_crds | map(attribute='metadata.name') | list }}"

- name: Count remaining custom resources for each orphan CRD
  kubernetes.core.k8s_info:
    api_version: "{{ item.spec.group }}/{{ (item.spec.versions | selectattr('storage') | first).name }}"
    kind: "{{ item.spec.names.kind }}"
  loop: "{{ cnv_orphan_crds }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: cnv_crd_usage

- name: Stop if a CRD still has objects
  ansible.builtin.assert:
    that: cnv_crd_usage.results | selectattr('resources', 'defined') | map(attribute='resources') | flatten | length == 0
    fail_msg: >-
      Some KubeVirt/CNV objects still exist (stuck finalizers?):
      {{ cnv_crd_usage.results | selectattr('resources', 'defined') | map(attribute='resources') | flatten
         | map(attribute='kind') | zip(cnv_crd_usage.results | selectattr('resources', 'defined')
         | map(attribute='resources') | flatten | map(attribute='metadata.name')) | map('join', '/') | list }}
    quiet: true

- name: Delete orphan CRDs
  kubernetes.core.k8s:
    state: absent
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 300
  loop: "{{ cnv_orphan_crds }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# Stale APIServices break API discovery for every client, so check them too.
- name: List APIServices
  kubernetes.core.k8s_info:
    api_version: apiregistration.k8s.io/v1
    kind: APIService
  register: cnv_apiservices

- name: Delete APIServices that point to {{ cnv_namespace }}
  kubernetes.core.k8s:
    state: absent
    api_version: apiregistration.k8s.io/v1
    kind: APIService
    name: "{{ item.metadata.name }}"
  loop: "{{ cnv_apiservices.resources | selectattr('spec.service', 'defined') | rejectattr('spec.service', 'none') | selectattr('spec.service.namespace', 'equalto', cnv_namespace) | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: List admission webhooks
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item }}"
  loop: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
  register: cnv_webhooks

- name: Select webhooks whose service lives in {{ cnv_namespace }}
  ansible.builtin.set_fact:
    cnv_stale_webhooks: >-
      {%- set out = [] -%}
      {%- for cfg in cnv_webhooks.results | map(attribute='resources') | flatten -%}
      {%-   for wh in cfg.webhooks | default([]) -%}
      {%-     if (wh.clientConfig.service | default({}, true)).namespace | default('') == cnv_namespace and cfg not in out -%}
      {%-       set _ = out.append(cfg) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Delete webhooks whose service lives in {{ cnv_namespace }}
  kubernetes.core.k8s:
    state: absent
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item.kind }}"
    name: "{{ item.metadata.name }}"
  loop: "{{ cnv_stale_webhooks }}"
  loop_control:
    label: "{{ item.kind }} {{ item.metadata.name }}"

- name: List SecurityContextConstraints
  kubernetes.core.k8s_info:
    api_version: security.openshift.io/v1
    kind: SecurityContextConstraints
  register: cnv_sccs

# CNV's SCCs (kubevirt-handler, kubevirt-controller, containerized-data-importer, ...)
# would get in the way of the SCCs upstream virt-operator/cdi-operator create.
- name: Select SCCs that only grant access to CNV service accounts
  ansible.builtin.set_fact:
    cnv_stale_sccs: >-
      {%- set out = [] -%}
      {%- for scc in cnv_sccs.resources -%}
      {%-   set users = scc.users | default([], true) -%}
      {%-   if users and (users | reject('match', '^system:serviceaccount:' ~ cnv_namespace ~ ':') | list | length == 0) -%}
      {%-     set _ = out.append(scc.metadata.name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Delete SCCs that only grant access to CNV service accounts
  kubernetes.core.k8s:
    state: absent
    api_version: security.openshift.io/v1
    kind: SecurityContextConstraints
    name: "{{ item }}"
  loop: "{{ cnv_stale_sccs }}"

- name: Read Console operator config
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: Console
    name: cluster
  register: cnv_console

- name: Find kubevirt-plugin in the console plugin list
  ansible.builtin.set_fact:
    cnv_plugin_index: "{{ (cnv_console.resources[0].spec.plugins | default([])).index('kubevirt-plugin') }}"  # noqa: jinja[invalid] guarded by when
  when: "'kubevirt-plugin' in (cnv_console.resources[0].spec.plugins | default([]))"

- name: Remove kubevirt-plugin from the console plugin list
  kubernetes.core.k8s_json_patch:
    api_version: operator.openshift.io/v1
    kind: Console
    name: cluster
    patch:
      - op: test
        path: "/spec/plugins/{{ cnv_plugin_index }}"
        value: kubevirt-plugin
      - op: remove
        path: "/spec/plugins/{{ cnv_plugin_index }}"
  when: cnv_plugin_index is defined
