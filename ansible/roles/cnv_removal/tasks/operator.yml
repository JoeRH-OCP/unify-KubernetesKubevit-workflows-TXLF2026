---
- name: Delete the HyperConverged CR
  when: pf_hco.resources | default([]) | length > 0
  vars:
    hco_ns: "{{ pf_hco.resources[0].metadata.namespace }}"
    hco_name: "{{ pf_hco.resources[0].metadata.name }}"
  block:
    - name: Delete the HyperConverged CR and wait until it is gone
      kubernetes.core.k8s:
        state: absent
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        namespace: "{{ hco_ns }}"
        name: "{{ hco_name }}"
        wait: true
        wait_timeout: "{{ cnv_hco_wait_timeout }}"
  rescue:
    # Known HCO deadlock: it removes SSP, then its own validating webhook rejects
    # the finalizer removal because SSP is missing. Removing the operator (CSV)
    # also removes its webhooks; then the finalizer can go.
    - name: Explain the fallback
      ansible.builtin.debug:
        msg: >-
          HyperConverged is still terminating after {{ cnv_hco_wait_timeout }}s (HCO webhook deadlock).
          Removing the operator first, then the finalizer.

    - name: Wait until HCO removed its components (KubeVirt, CDI, SSP, NetworkAddonsConfig)
      ansible.builtin.include_tasks: hco_children.yml

    - name: Delete the OpenShift Virtualization Subscription and CSV
      ansible.builtin.include_tasks: olm.yml

    - name: Wait until OLM removed the HCO webhooks
      kubernetes.core.k8s_info:
        api_version: admissionregistration.k8s.io/v1
        kind: "{{ item }}"
      loop: [ValidatingWebhookConfiguration, MutatingWebhookConfiguration]
      register: hco_webhooks
      until: >-
        hco_webhooks.resources | map(attribute='metadata.name')
        | select('search', '(hco|ssp|hostpath-provisioner)[.]kubevirt[.]io') | list | length == 0
      retries: 18
      delay: 10
      failed_when: false

    - name: Delete HCO webhooks OLM left behind
      kubernetes.core.k8s:
        state: absent
        api_version: admissionregistration.k8s.io/v1
        kind: "{{ item.kind }}"
        name: "{{ item.metadata.name }}"
      loop: >-
        {{ hco_webhooks.results | map(attribute='resources') | flatten
           | selectattr('metadata.name', 'search', '(hco|ssp|hostpath-provisioner)[.]kubevirt[.]io') | list }}
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

    - name: Remove the HyperConverged finalizers
      kubernetes.core.k8s_json_patch:
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        namespace: "{{ hco_ns }}"
        name: "{{ hco_name }}"
        patch:
          - op: remove
            path: /metadata/finalizers

    - name: Wait until the HyperConverged CR is gone
      kubernetes.core.k8s_info:
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        namespace: "{{ hco_ns }}"
        name: "{{ hco_name }}"
      register: hco_gone
      until: hco_gone.resources | default([]) | length == 0
      retries: 30
      delay: 5

- name: Wait until HCO removed its components (KubeVirt, CDI, SSP, NetworkAddonsConfig)
  ansible.builtin.include_tasks: hco_children.yml

- name: Delete the OpenShift Virtualization Subscription and CSV
  ansible.builtin.include_tasks: olm.yml

- name: Delete the CNV namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ cnv_namespace }}"
    wait: true
    wait_timeout: "{{ cnv_wait_timeout }}"

- name: Delete the CNV golden images namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ cnv_os_images_namespace }}"
    wait: true
    wait_timeout: "{{ cnv_wait_timeout }}"
  when: cnv_delete_os_images_namespace | bool
