---
- name: Show what will be deleted
  ansible.builtin.debug:
    msg: "Deleting {{ pf_existing_vms | length }} VirtualMachine(s): {{ pf_existing_vms | join(', ') or 'none' }}"

- name: Delete VirtualMachines (all namespaces)
  kubernetes.core.k8s:
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 600
  loop: "{{ pf_vms.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: List remaining VirtualMachineInstances
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
  register: cnv_vmis

- name: Delete VirtualMachineInstances
  kubernetes.core.k8s:
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 600
  loop: "{{ cnv_vmis.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: List DataImportCrons, DataSources and DataVolumes
  kubernetes.core.k8s_info:
    api_version: cdi.kubevirt.io/v1beta1
    kind: "{{ item }}"
  loop: [DataImportCron, DataSource, DataVolume]
  register: cnv_cdi_objs

- name: Delete DataImportCrons, DataSources and DataVolumes
  kubernetes.core.k8s:
    state: absent
    api_version: cdi.kubevirt.io/v1beta1
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 600
  loop: "{{ cnv_cdi_objs.results | map(attribute='resources') | flatten }}"
  loop_control:
    label: "{{ item.kind }} {{ item.metadata.namespace }}/{{ item.metadata.name }}"
