---
# KubeVirt rejects inline cloud-init userData over 2048 bytes, and the demo
# cloud-init (banner, MOTD script, SSH key) is larger than that. Every demo VM
# reads it from a Secret instead (cloudInitNoCloud.secretRef).
# Vars: ci_secret_name, ci_hostname, ci_component, ci_web (optional).
- name: Cloud-init Secret {{ ci_secret_name }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ ci_secret_name }}"
        namespace: "{{ demo_namespace }}"
        labels: "{{ event_labels | combine({'app.kubernetes.io/component': ci_component}) }}"
      data:
        userdata: "{{ lookup('ansible.builtin.template', 'cloud-init.yaml.j2', template_vars={'ci_hostname': ci_hostname, 'ci_web': ci_web | default(false)}) | b64encode }}"
