---
# Upstream's nginx only protects the UI (location /) with basic auth, not the
# /k8s proxy to the Kubernetes API, which runs with cluster-wide VM rights.
# Our default.conf (templates/default.conf.j2) adds auth to /k8s as well, and
# auth is always on: if no password is given we generate one.
#
# The password file is the source of truth between runs: a password given with
# kubevirt_manager_auth_password (e.g. -e on one run) is saved there, so later
# runs without -e keep it instead of going back to a generated one.
- name: Ensure reports directory exists
  ansible.builtin.file:
    path: "{{ kubevirt_manager_password_file | dirname }}"
    state: directory
    mode: "0755"
  check_mode: false

- name: Save the given password so later runs keep it
  ansible.builtin.copy:
    dest: "{{ kubevirt_manager_password_file }}"
    content: "{{ kubevirt_manager_auth_password }}\n"
    mode: "0600"
  when: kubevirt_manager_auth_password | length > 0
  check_mode: false
  no_log: true

- name: Pick the kubevirt-manager password (saved, or generated once)
  ansible.builtin.set_fact:
    # Read the file as plain text (the password lookup would parse " salt=").
    kvm_password: >-
      {{ kubevirt_manager_auth_password
         if kubevirt_manager_auth_password | length > 0
         else (lookup('ansible.builtin.file', kubevirt_manager_password_file)
               if kubevirt_manager_password_file is file
               else lookup('ansible.builtin.password', kubevirt_manager_password_file,
                           chars=['ascii_letters', 'digits'], length=20)) }}
  no_log: true

- name: Basic auth config (auth.d)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: auth-config
        namespace: "{{ kubevirt_manager_namespace }}"
        labels: "{{ event_labels | combine({'app': 'kubevirt-manager'}) }}"
      data:
        basicauth.conf: |
          auth_basic "{{ event_name }} - KubeVirt Manager";
          auth_basic_user_file /etc/nginx/secret.d/.htpasswd;

- name: Basic auth users (secret.d/.htpasswd)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: auth-secret
        namespace: "{{ kubevirt_manager_namespace }}"
        labels: "{{ event_labels | combine({'app': 'kubevirt-manager'}) }}"
      type: Opaque
      data:
        # Fixed salt derived from the password keeps this task idempotent.
        .htpasswd: "{{ (kubevirt_manager_auth_user ~ ':' ~ (kvm_password | password_hash('sha512', (kvm_password | hash('sha256'))[:16])) ~ '\n') | b64encode }}"
  no_log: true
