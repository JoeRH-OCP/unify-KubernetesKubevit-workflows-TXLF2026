---
# Delete VMs while KubeVirt is still running so virt-launcher pods stop cleanly.
- name: Delete demo VMs, snapshots and volumes (keeps nothing)
  ansible.builtin.include_role:
    name: demo_vms
    tasks_from: reset.yml

- name: Delete golden-image
  kubernetes.core.k8s:
    state: absent
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    namespace: "{{ demo_namespace }}"
    name: "{{ golden_image_name }}"
    wait: true
    wait_timeout: 300

- name: Delete golden-image PVC
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ demo_namespace }}"
    name: "{{ golden_image_name }}"
    wait: true
    wait_timeout: 300
